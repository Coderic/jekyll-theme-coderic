<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: site.portal_name | default: site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <meta name="google" content="notranslate">

    <!-- i18n hreflang alternate links (Robust Polyglot Logic) -->
    {% if site.languages %}
      {% include i18n_clean_path.html %}
      {% for lang in site.languages %}
        {% if lang == site.default_lang %}
          <link rel="alternate" hreflang="{{ lang }}" href="{{ site.url }}{{ site.baseurl }}{{ clean_page_url | relative_url }}" />
        {% else %}
          <link rel="alternate" hreflang="{{ lang }}" href="{{ site.url }}{{ site.baseurl }}/{{ lang }}{{ clean_page_url | relative_url | replace: '//', '/' }}" />
        {% endif %}
      {% endfor %}
    {% endif %}


    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;800&family=Red+Hat+Display:wght@400;600&family=Open+Sans:wght@600&display=swap" rel="stylesheet">
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Alpine.js: UI reactiva en páginas que lo usan (ej. demo Petstore) -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
    <!-- Auth0 SPA JS SDK (oficial) -->
    <script defer src="https://cdn.auth0.com/js/auth0-spa-js/2.4/auth0-spa-js.production.js"></script>
    
    <style id="coderic-theme-variables">
        :root {
            --bg-surface: #ffffff;
            --bg-surface-alt: #f8fafc;
            --bg-panel: rgba(0, 0, 0, 0.05);
            --border-surface: rgba(0, 0, 0, 0.1);
            --text-base: #020617; /* slate-950 */
            --text-muted: #FFFFFF; /* slate-600 — better contrast on light */
        }
        .dark {
            --bg-surface: #050505;
            --bg-surface-alt: #0a0a0a;
            --bg-panel: rgba(255, 255, 255, 0.03);
            --border-surface: rgba(255, 255, 255, 0.08);
            --text-base: #f8fafc; /* slate-50 */
            --text-muted: #000000; /* slate-400 — much better contrast on dark */
        }

        /* Brand surfaces: solid colors only (no decorative gradients on content) */
        .brand-coderic {
            background: linear-gradient(180deg,
                hsl(0, 0%, 58%) 0%,
                hsl(0, 0%, 80%) 47%,
                hsl(0, 0%, 38%) 53%,
                hsl(0, 0%, 58%) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 35px;
            font-weight: normal;
            font-family: 'Red Hat Display', sans-serif;
            letter-spacing: -2px;
            line-height: 1;
            display: inline-block;
            vertical-align: middle;
        }

        /* Cabecera: mismo degradé, tamaño acotado al bloque del logo */
        #global-header .brand-coderic {
            font-size: clamp(1.2rem, 2.4vw, 2rem);
            letter-spacing: -1.5px;
        }
    </style>
    <script id="coderic-theme-controller" data-cfasync="false">
        (function() {
            const theme = localStorage.getItem('coderic-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            if (theme === 'dark') document.documentElement.classList.add('dark');
            else document.documentElement.classList.remove('dark');
        })();
        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('coderic-theme', isDark ? 'dark' : 'light');
        }
    </script>

    <link rel="stylesheet" href="{{ '/assets/css/theme.css' | relative_url }}">
</head>
