# ── OAuth / PKCE demo (doc) ───────────────────────────────────────────────────
oauth_demo:
  title: "OAuth 2.0 & PKCE (theme demo)"
  lead: "Staging defaults use [AuthTester](https://www.scottbrady.io/tools/auth-tester) (Scott Brady): discovery [openid-configuration](https://www.scottbrady.io/tools/auth-tester/.well-known/openid-configuration). With `oauth_demo_sign_in: false`, PKCE uses `/callback/` on this origin."
  step1_title: "Demo vs real sign-in"
  step1_md: "**`oauth_demo_sign_in: false`** → Sign in uses Auth0 Universal Login via the official SPA SDK and returns to `/callback/`."
  step2_title: "AuthTester vs your IdP"
  step2_md: "Use `client_id=test` and the discovery document’s endpoints for quick tests. Configure URLs in the tester UI if offered (`…/configure?requestId=` is session-scoped). For production IdPs, register this site’s `/callback/` on the client."
  step3_title: "_config.yml"
  step3_md: "`oidc_client_id` and `oidc_domain` (custom domain or Auth0 tenant). Optional: `oauth_redirect_uri` — see file comments."
  cta_debugger: "Open AuthTester"

