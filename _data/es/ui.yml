# ── OAuth / PKCE (demo documentación) ─────────────────────────────────────────
oauth_demo:
  title: "OAuth 2.0 y PKCE (demo del tema)"
  lead: "Por defecto el staging usa [AuthTester](https://www.scottbrady.io/tools/auth-tester) (Scott Brady): descubrimiento [openid-configuration](https://www.scottbrady.io/tools/auth-tester/.well-known/openid-configuration). Con `oauth_demo_sign_in: false`, el PKCE usa `/callback/` en este origen."
  step1_title: "Demo vs login real"
  step1_md: "**`oauth_demo_sign_in: false`** → Iniciar sesión usa Auth0 Universal Login mediante el SDK SPA oficial y vuelve a `/callback/`."
  step2_title: "AuthTester vs tu IdP"
  step2_md: "Para pruebas rápidas usá `client_id=test` y los endpoints del documento de descubrimiento. Si el tester ofrece configuración con `…/configure?requestId=`, el `requestId` es de sesión (generalo en la UI, no en el repo). En producción registrá `/callback/` en el cliente del IdP."
  step3_title: "_config.yml"
  step3_md: "`oidc_client_id` y `oidc_domain` (custom domain o tenant de Auth0). Opcional: `oauth_redirect_uri` — ver comentarios en el archivo."
  cta_debugger: "Abrir AuthTester"

